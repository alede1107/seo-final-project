<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body {
      width: 260px;
      margin: 0;
      padding: 16px;
      font-family: system-ui, sans-serif;
      background: #0f1117;
      color: #e6e6e6;
    }
    h1 { font-size: 14px; margin: 0 0 4px; }
    #video-id { font-size: 12px; color: #8a8f98; margin: 0 0 12px; word-break: break-all; }
    button {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    #prepare { background: #1f6feb; color: white; margin-bottom: 8px; }
    #start { background: #2ea043; color: white; }
    #stop { background: #da3633; color: white; margin-top: 8px; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    #prepare-progress { margin: 0 0 12px; }
    .prepare-progress-meta {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 6px;
      font-size: 11px;
      color: #b8bec8;
    }
    #prepare-percent { color: #58a6ff; font-variant-numeric: tabular-nums; }
    #prepare-progress-track {
      height: 7px;
      overflow: hidden;
      border-radius: 999px;
      background: #282c34;
    }
    #prepare-progress-fill {
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: #1f6feb;
      transition: width 400ms ease;
    }
    #prepared { font-size: 12px; margin: 0 0 12px; color: #8a8f98; min-height: 16px; }
    #status { font-size: 12px; margin-top: 12px; color: #8a8f98; min-height: 16px; }
    .recording { color: #f0883e !important; }
    .ready { color: #2ea043 !important; }
  </style>
</head>
<body>
  <h1>SignStream</h1>
  <p id="video-id">No YouTube video detected</p>
  <button id="prepare">Prepare captions</button>
  <div id="prepare-progress" role="status" aria-live="polite" hidden>
    <div class="prepare-progress-meta">
      <span id="prepare-stage">Starting preparation</span>
      <span id="prepare-percent">0%</span>
    </div>
    <div
      id="prepare-progress-track"
      role="progressbar"
      aria-label="Caption preparation progress"
      aria-valuemin="0"
      aria-valuemax="100"
      aria-valuenow="0"
    >
      <div id="prepare-progress-fill"></div>
    </div>
  </div>
  <p id="prepared"></p>
  <button id="start">Start capture</button>
  <button id="stop" disabled>Stop capture</button>
  <p id="status"></p>
  <script src="popup.js"></script>
</body>
</html>
